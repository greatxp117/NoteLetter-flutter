name: flutter_app
description: NoteLetter - AI-powered newsletter and knowledge base app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  file_picker: ^8.0.7
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.1.0
  dio: ^5.9.2
  url_launcher: ^6.3.2
  mime: ^2.0.0
  flutter_html: ^3.0.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/contract/
    - assets/landing-hero.png
    - assets/hero-knowledge.png
    - assets/favicon.png
  # UI/body font is Geist, mono is Geist Mono (design-tokens.md). Neither is on
  # the google_fonts package, so they are bundled as OFL assets (assets/fonts/,
  # license in Geist-OFL.txt). Serif (Source Serif 4) still comes from google_fonts.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
