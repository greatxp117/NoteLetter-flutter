name: flutter_app
description: NoteLetter - AI-powered newsletter and knowledge base app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'
  # The eMudhra floor (test/contract/firebase_sdk_floor_test.dart): on Android
  # `dart:io` validates TLS with Dart's own compiled-in BoringSSL, so every
  # Flutter below 3.47.8 (Dart 3.13.7) trusts the revoked intermediates, for
  # Firestore and for Dio's fn_* calls alike. It also builds the patched
  # FlutterFire set for iOS: firebase_auth 6.6+ needs Flutter 3.38+. This is a
  # FLOOR on the SDK, not the language version — `sdk` above still says 3.9.
  # The machine's shared ~/development/flutter is 3.35.4; this workspace runs
  # /Volumes/DevCache/flutter-sdk/3.47.9 (the umbrella's SessionStart hook).
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  file_picker: ^8.0.7
  # FLOORS, not suggestions: FlutterFire BoM 4.20.1 (2026-10-23) is the first
  # family whose iOS side carries the eMudhra fix — `firebase_core` 4.15.1 pins
  # the Firebase iOS SDK to 12.19.3, and FirebaseFirestore 12.19.2 and earlier
  # trusts the revoked intermediates it compiles in, so a man-in-the-middle can
  # impersonate Firestore. Never lower any of these five; Firebase 13 / BoM 5.x
  # is SPM-only, a separate move. Gated by
  # test/contract/firebase_sdk_floor_test.dart.
  firebase_core: ^4.15.1
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.1
  dio: ^5.9.2
  url_launcher: ^6.3.2
  mime: ^2.0.0
  flutter_html: ^3.0.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  # The camera-roll sweep's ledger lives in this app's App Group suite
  # (F-125 S2); 2.5.2 fixed getAll under a suite name.
  shared_preferences_foundation: ^2.5.2
  # ...and on Android in its own SharedPreferences file (F-125 S5c).
  shared_preferences_android: ^2.4.23
  visibility_detector: ^0.4.0+2
  firebase_app_installations: ^0.4.5
  # Pinned EXACTLY: a measurement plugin moves with the family, never ahead of
  # it — a newer analytics requires a newer `firebase_core`, which moves the
  # Firebase iOS SDK that Auth, Firestore and Installations all run on, on a
  # client that points at REAL PROD. 12.6.1 is BoM 4.20.1's (the eMudhra-patched
  # family above); move it only with the other four.
  firebase_analytics: 12.6.1
  flutter_html_table: ^3.0.0
  webview_flutter: ^4.13.1
  # Pinned, not floated: `flutter_html` 3.0.0 calls `queryselector.matches`,
  # which html 0.15.7 removed — so a float here fails to COMPILE every screen
  # that renders chunk HTML. Declared directly because
  # `shared/extraction_markers.dart` imports it (and the marker gate runs that
  # file under plain `dart run`), not because anything wanted a newer one.
  html: 0.15.6
  # Continue with Google (F-44a). google_sign_in_ios 6.2.x (the newest that
  # ran on Flutter 3.35) wants GoogleSignIn ~> 9.0, whose 9.x line pins
  # GTMSessionFetcher/Core ~> 3.3 — so adding it moved that ONE transitive pod
  # from 5.3.1 to 3.5.0, inside FirebaseAuth's own declared range
  # (>= 3.4, < 6.0). Flutter 3.38+ (this app is on 3.47 since the eMudhra
  # floor) allows google_sign_in_ios 6.3 → GoogleSignIn 10 → GTMSessionFetcher
  # 5; that lift is available and NOT taken — the lock still holds 6.2.x.
  google_sign_in: ^7.2.0
  flutter_web_auth_2: ^5.1.0
  path_parsing: ^1.1.0
  pdfx: ^2.11.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # F-125 S1: the camera-roll sweep's key, recomputed in its tests (already
  # resolved transitively; declared because a test now imports it).
  crypto: ^3.0.6
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # iOS plugins stay on CocoaPods. Flutter 3.47 turns Swift Package Manager on
  # by default, and `pod install` then drops every plugin pod — while the Share
  # extension links FirebaseAuth through ios/Podfile, so SPM would put two
  # Firebases in one app. Moving to SPM is its own change, owed before the next
  # Firebase set: Firebase stopped publishing CocoaPods after October 2026.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/contract/
    - assets/landing-hero.png
    - assets/hero-knowledge.png
    - assets/favicon.png
  # All three token fonts are BUNDLED as OFL assets (assets/fonts/, licenses in
  # Geist-OFL.txt and SourceSerif4-OFL.txt): sans Geist, mono Geist Mono, serif
  # Source Serif 4 (design-tokens.md).
  #
  # The serif previously resolved through `google_fonts`, which fetches over the
  # network on first use and falls back silently when that fails — on every
  # heading, the display ramp and the reader's body text. A silent fallback to
  # the platform serif is invisible in review and impossible to see in a test.
  # The TTFs are the same variable files the Swift app ships, so both clients
  # render from one file rather than two sources that can drift.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    # Variable files — one asset covers the whole weight axis, driven by
    # FontVariation('wght') in AppTheme.serif rather than by separate cuts.
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
        - asset: assets/fonts/SourceSerif4-Italic-Variable.ttf
          style: italic
