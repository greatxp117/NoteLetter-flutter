name: flutter_app
description: NoteLetter - AI-powered newsletter and knowledge base app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  file_picker: ^8.0.7
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.1.0
  dio: ^5.9.2
  url_launcher: ^6.3.2
  mime: ^2.0.0
  flutter_html: ^3.0.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  visibility_detector: ^0.4.0+2
  firebase_app_installations: ^0.4.2+7
  # Pinned EXACTLY, and low, on purpose. `firebase_analytics` 12.5.0+ requires
  # `firebase_core ^4.14.0`, which pins the Firebase **iOS SDK** to 12.19.0 —
  # so adding a measurement plugin would move the SDK that Auth, Firestore and
  # Installations all run on, on a client that points at REAL PROD. 12.4.6 is
  # the newest analytics that pairs with the `firebase_core 4.13.0` already
  # locked here, and it leaves the iOS SDK at 12.17.0 and every other plugin
  # untouched. Adding a member is not a reason to move the family.
  firebase_analytics: 12.4.6
  flutter_html_table: ^3.0.0
  webview_flutter: ^4.13.1
  # Pinned, not floated: `flutter_html` 3.0.0 calls `queryselector.matches`,
  # which html 0.15.7 removed — so a float here fails to COMPILE every screen
  # that renders chunk HTML. Declared directly because
  # `shared/extraction_markers.dart` imports it (and the marker gate runs that
  # file under plain `dart run`), not because anything wanted a newer one.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/contract/
    - assets/landing-hero.png
    - assets/hero-knowledge.png
    - assets/favicon.png
  # All three token fonts are BUNDLED as OFL assets (assets/fonts/, licenses in
  # Geist-OFL.txt and SourceSerif4-OFL.txt): sans Geist, mono Geist Mono, serif
  # Source Serif 4 (design-tokens.md).
  #
  # The serif previously resolved through `google_fonts`, which fetches over the
  # network on first use and falls back silently when that fails — on every
  # heading, the display ramp and the reader's body text. A silent fallback to
  # the platform serif is invisible in review and impossible to see in a test.
  # The TTFs are the same variable files the Swift app ships, so both clients
  # render from one file rather than two sources that can drift.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    # Variable files — one asset covers the whole weight axis, driven by
    # FontVariation('wght') in AppTheme.serif rather than by separate cuts.
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
        - asset: assets/fonts/SourceSerif4-Italic-Variable.ttf
          style: italic
